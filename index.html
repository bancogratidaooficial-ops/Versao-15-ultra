<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFD700">
<link rel="manifest" href="manifest.json">
<title>Banco Gratidão V15.0 ULTRA - TUDO + LIXEIRINHA + APOIAR + VIP + IA</title>
<style>
:root{--g:#FFD700}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#000;color:#fff;padding-bottom:120px}
.top{position:sticky;top:0;z-index:99;background:#000;border-bottom:3px solid var(--g);padding:8px;display:flex;gap:6px;overflow:auto;white-space:nowrap;scrollbar-width:none}
.pill{padding:10px 14px;border-radius:30px;border:2px solid #333;background:#1a1a1a;color:#fff;font-weight:900;font-size:12px;white-space:nowrap}
.pill.on{background:var(--g);color:#000}
.wrap{max-width:820px;margin:auto;padding:10px}
.card{margin:12px 0;border:3px solid var(--g);border-radius:18px;padding:14px;background:#111;position:relative}
.h{color:var(--g);font-weight:900;font-size:17px;margin-bottom:8px}
.btn{background:var(--g);color:#000;border:none;border-radius:30px;padding:14px;font-weight:900;width:100%;margin-top:8px;font-size:15px}
.btn2{background:#111;color:var(--g);border:2px solid var(--g);border-radius:30px;padding:12px;font-weight:900;width:100%;margin-top:6px}
.btn-vip{background:linear-gradient(135deg,gold,#ff8c00);color:#000;border:3px solid #fff;border-radius:30px;padding:14px;font-weight:900;width:100%;margin-top:8px;font-size:16px}
.in{width:100%;background:#000;border:2px solid #333;border-radius:12px;padding:12px;color:#fff;margin:6px 0}
.item{display:flex;justify-content:space-between;align-items:center;background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;margin:7px 0;gap:8px}
.screen{display:none}.screen.show{display:block}
.clock{font-size:48px;text-align:center;color:var(--g);font-weight:900}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-day{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px;text-align:center;font-size:12px}
.cal-day.today{background:gold;color:#000;font-weight:900}
.cal-day.has{border-color:gold;background:#222}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.trash-btn{background:#300;border:2px solid #f44;color:#f88;border-radius:10px;padding:6px 10px;font-weight:900}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.apoio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.apoio-btn{background:#111;border:2px solid gold;color:gold;border-radius:16px;padding:14px;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div class="top">
<button class="pill on" onclick="tab('alarme',this)">⏰ Alarme</button>
<button class="pill" onclick="tab('midia',this)">📁 Mídia</button>
<button class="pill" onclick="tab('fotos',this)">📸 Fotos</button>
<button class="pill" onclick="tab('calend',this)">🗓️ Calendário</button>
<button class="pill" onclick="tab('grat',this)">✨ Gratidão</button>
<button class="pill" onclick="tab('banco',this)">💰 Banco</button>
<button class="pill" onclick="tab('fin',this)">💎 Finanças</button>
<button class="pill" onclick="tab('relogio',this)">🕐 Relógio</button>
<button class="pill" onclick="tab('calc',this)">🧮 Calc</button>
<button class="pill" onclick="tab('salario',this)">💼 Salário</button>
<button class="pill" onclick="tab('mercado',this)">🛒 Mercado</button>
<button class="pill" onclick="tab('grav',this)">🎙️ Gravar</button>
<button class="pill" onclick="tab('sonora',this)">🎵 Sonora</button>
<button class="pill" onclick="tab('ia',this)">🤖 IA</button>
<button class="pill" onclick="tab('hab',this)">✅ Hábitos</button>
<button class="pill" onclick="tab('diario',this)">📖 Diário</button>
<button class="pill" onclick="tab('med',this)">🧘 Med</button>
<button class="pill" onclick="tab('mapa',this)">🗺️ Mapas</button>
<button class="pill" onclick="tab('apoiar',this)">❤️ Apoiar</button>
<button class="pill" onclick="tab('vip',this)">👑 VIP</button>
<button class="pill" onclick="tab('backup',this)">💾 Backup</button>
</div>
<div class="wrap">
<div id="s-alarme" class="screen show"><div class="card"><h3 class="h">⏰ Alarme com toque do celular</h3><input id="alarmTime" type="time" class="in"><input id="alarmLabel" class="in" placeholder="Nome"><select id="alarmSound" class="in"><option value="beep">🔔 Beep</option><option value="custom">📁 Meu toque</option></select><div style="border:3px dashed gold;border-radius:16px;padding:12px;margin-top:8px"><input type="file" id="customToneFile" accept="audio/*" class="in"><audio id="customTonePreview" controls style="width:100%;display:none;margin-top:6px"></audio><button class="btn2" onclick="saveCustomTone()">💾 Salvar toque</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn" onclick="addAlarm()">+ Adicionar</button><button class="btn2" onclick="testAlarm()">🔊 Testar</button></div><div id="listAlarm" style="margin-top:10px"></div><audio id="alarmAudio" loop></audio></div></div>
<div id="s-midia" class="screen"><div class="card"><h3 class="h">📁 Mídia com lixeirinha</h3><input type="file" id="addAudioFile" accept="audio/*" class="in"><button class="btn" onclick="addAudioFromPhone()">+ 🎵 Música do celular</button><div id="listAudios" style="margin-top:10px"></div><hr style="margin:12px 0;border:1px solid #333"><input type="file" id="addFotoFileMidia" accept="image/*" class="in"><button class="btn" onclick="addFotoFromPhoneMidia()">+ 📸 Foto</button><div id="listFotosMidia" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"></div><hr style="margin:12px 0;border:1px solid #333"><input type="file" id="addVideoFile" accept="video/*" class="in"><button class="btn" onclick="addVideoFromPhone()">+ 🎬 Vídeo</button><div id="listVideos" style="margin-top:10px"></div></div></div>
<div id="s-fotos" class="screen"><div class="card"><h3 class="h">📸 Fotos com lixeirinha</h3><input type="file" id="addFotoFile" accept="image/*" class="in"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn" onclick="addFotoFromPhone()">+ Salvar foto</button><button class="btn2" onclick="captureFoto()">📸 Tirar foto</button></div><video id="fotoPreview" autoplay playsinline style="width:100%;border-radius:12px;display:none;margin-top:8px"></video><canvas id="fotoCanvas" style="display:none"></canvas><div id="listF" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"></div></div></div>
<div id="s-calend" class="screen"><div class="card"><h3 class="h">🗓️ Calendário</h3><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn2" style="width:auto" onclick="changeMonth(-1)">◀</button><h3 id="calTitle" style="color:gold"></h3><button class="btn2" style="width:auto" onclick="changeMonth(1)">▶</button></div><div class="cal-grid" style="color:gold;font-weight:900;margin-top:8px"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div><div id="calGrid" class="cal-grid"></div><hr style="margin:10px 0;border:1px solid #333"><input id="eventDate" type="date" class="in"><input id="eventText" class="in" placeholder="Evento"><input type="file" id="eventFoto" accept="image/*" class="in"><button class="btn" onclick="addEvent()">+ Adicionar evento</button><div id="listEvents" style="margin-top:10px"></div></div></div>
<div id="s-grat" class="screen"><div class="card"><h3 class="h">✨ Gratidão com foto e áudio</h3><input id="gratText" class="in" placeholder="Pelo que sou grato hoje?"><input type="file" id="gratFoto" accept="image/*" class="in"><input type="file" id="gratAudio" accept="audio/*" class="in"><button class="btn2" onclick="recordGratAudio()">🎙️ Gravar áudio</button><audio id="gratAudioPreview" controls style="width:100%;display:none;margin-top:6px"></audio><button class="btn" onclick="addGrat()">+ Adicionar gratidão</button><div id="listGrat" style="margin-top:10px"></div></div></div>
<div id="s-banco" class="screen"><div class="card"><h3 class="h">💰 Banco com foto</h3><h2 id="bankSaldo" style="color:gold;text-align:center">R$ 0,00</h2><input id="bankValor" type="number" class="in" placeholder="Valor"><input id="bankDesc" class="in" placeholder="Descrição"><input type="file" id="bankFoto" accept="image/*" class="in"><select id="bankTipo" class="in"><option value="entrada">💚 Entrada</option><option value="saida">❤️ Saída</option></select><button class="btn" onclick="addBank()">+ Adicionar</button><div id="listBank" style="margin-top:10px"></div></div></div>
<div id="s-fin" class="screen"><div class="card"><h3 class="h">💎 Finanças com comprovante</h3><input id="finValor" type="number" class="in" placeholder="Valor"><input id="finDesc" class="in" placeholder="Descrição"><input type="file" id="finFoto" accept="image/*" class="in"><select id="finTipo" class="in"><option value="ganho">💚 Ganho</option><option value="gasto">❤️ Gasto</option></select><button class="btn" onclick="addFin()">+ Adicionar</button><div id="listFin" style="margin-top:10px"></div></div></div>
<div id="s-relogio" class="screen"><div class="card" style="text-align:center"><h3 class="h">🕐 Relógio</h3><div id="clockBig" class="clock">00:00:00</div><div id="clockDate" style="color:gold"></div></div></div>
<div id="s-calc" class="screen"><div class="card"><h3 class="h">🧮 Calculadora</h3><input id="calcDisplay" class="in" style="font-size:22px;text-align:right" readonly><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px"><button class="btn2" onclick="calcPress('7')">7</button><button class="btn2" onclick="calcPress('8')">8</button><button class="btn2" onclick="calcPress('9')">9</button><button class="btn2" onclick="calcPress('/')">/</button><button class="btn2" onclick="calcPress('4')">4</button><button class="btn2" onclick="calcPress('5')">5</button><button class="btn2" onclick="calcPress('6')">6</button><button class="btn2" onclick="calcPress('*')">x</button><button class="btn2" onclick="calcPress('1')">1</button><button class="btn2" onclick="calcPress('2')">2</button><button class="btn2" onclick="calcPress('3')">3</button><button class="btn2" onclick="calcPress('-')">-</button><button class="btn2" onclick="calcPress('0')">0</button><button class="btn2" onclick="calcPress('.')">.</button><button class="btn" onclick="calcEq()">=</button><button class="btn2" onclick="calcPress('+')">+</button><button class="btn2" onclick="calcClear()" style="grid-column:span 4">C LIMPAR</button></div></div></div>
<div id="s-salario" class="screen"><div class="card"><h3 class="h">💼 Salário com holerite</h3><input id="salValor" type="number" class="in" placeholder="Valor"><input id="salDesc" class="in" placeholder="Empresa/Mês"><input type="file" id="salFoto" accept="image/*" class="in"><button class="btn" onclick="addSal()">+ Adicionar</button><div id="listSal" style="margin-top:10px"></div></div></div>
